# gradle
org.gradle.jvmargs=-Xmx3G -Djava.net.preferIPv4Stack=true
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# 需要下载依赖时走本机 FlClash（端口按当前监听填，10909 或 10910）
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=10909
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=10909
systemProp.http.nonProxyHosts=localhost|127.*|[::1]
systemProp.https.nonProxyHosts=localhost|127.*|[::1]

# fabric
minecraft_version=1.21.1
loader_version=0.16.10
fabric_api_version=0.116.18+1.21.1
mod_version=0.5.3
maven_group=ysmstep
archives_base_name=ysmstep
